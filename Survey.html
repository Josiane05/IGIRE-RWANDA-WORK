<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Survey Form</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<h1 id="title">Gym Member Survey</h1>
<p id="description">Please help us improve our gym services by filling this form.</p>

<form id="survey-form">

<label id="name-label" for="name">Name</label>
<input 
type="text" 
id="name" 
placeholder="Enter your name" 
required>

<label id="email-label" for="email">Email</label>
<input 
type="email" 
id="email" 
placeholder="Enter your email" 
required>

<label id="number-label" for="number">Age</label>
<input 
type="number" 
id="number" 
min="10" 
max="80" 
placeholder="Enter your age">

<label for="dropdown">How often do you visit the gym?</label>
<select id="dropdown">
<option value="">Select an option</option>
<option value="daily">Daily</option>
<option value="weekly">Weekly</option>
<option value="monthly">Monthly</option>
</select>

<p>Membership Type</p>

<label>
<input type="radio" name="membership" value="basic">
Basic
</label>

<label>
<input type="radio" name="membership" value="premium">
Premium
</label>

<p>Facilities you use</p>

<label>
<input type="checkbox" value="weights">
Weights
</label>

<label>
<input type="checkbox" value="cardio">
Cardio Machines
</label>

<label>
<input type="checkbox" value="yoga">
Yoga
</label>

<label>
<input type="checkbox" value="swimming">
Swimming Pool
</label>

<p>Additional Comments</p>

<textarea placeholder="Write your comments here..."></textarea>

<br><br>

<button id="submit" type="submit">Submit</button>

</form>

</body>
</html>
